d:()=>`<p>🌐 <b>To show your custom messages, photos and music on every device:</b> tap Export data.json, then upload that file to your GitHub repo (next to index.html). Anyone opening the link will then see your custom version.</p><button data-a="ex">⬇ Export data.json</button><label>Backup JSON (copy from here, or paste a backup to import)<textarea id="bk" rows="6"></textarea></label><button data-a="im">⬆ Import from box</button><label>Or import a backup file<input type="file" id="imf" accept=".json,application/json"></label>`};
function rend(){const n={b:'Basic',m:'Messages',p:'Photos',u:'Music',t:'Theme',d:'Data'};A.innerHTML=`<div class="ap"><h2>⚙️ Admin Dashboard</h2><div class="tabs">${Object.keys(n).map(k=>`<button data-a="tab" data-t="${k}" style="${k==tab?'':'opacity:.5'}">${n[k]}</button>`).join('')}</div>${TABS[tab]()}<div class="bar"><button data-a="pv">👁 Preview</button><button data-a="save">💾 Save Changes</button><button data-a="out" style="background:#555">Exit</button></div></div>`}
function adLogin(){A.style.display='block';A.innerHTML='<div class="ap" style="max-width:360px;text-align:center;margin-top:20vh"><h2>⚙️ Admin Login</h2><input id="ap" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Admin password" style="-webkit-text-security:disc"><button class="btn" id="al">Enter</button><button class="btn" id="ax" style="background:#555">Back</button><p class="err" id="ae"></p></div>';
const ck=()=>{const v=$('#ap').value.trim();if(v&&v==String(C.admin).trim())rend();else $('#ae').textContent='Wrong password (default: admin123, unless you changed it)'};$('#al').addEventListener('click',ck);$('#ap').addEventListener('keydown',e=>{if(e.key=='Enter')ck()});$('#ax').addEventListener('click',out);setTimeout(()=>{try{$('#ap').focus()}catch(x){}},300)}
function out(){A.style.display='none';if(location.hash=='#admin')history.replaceState(null,'',location.pathname+location.search)}
async function save(){try{localStorage.setItem('nkC',JSON.stringify(C))}catch(e){}const a=await dbs('photos',PH),b=await dbs('music',MU);toast(a&&b?'Saved ✔ Everything is stored on this device':'Settings saved, but media storage is blocked by the browser')}
function preview(){A.style.display='none';pv=1;$('#pb').style.display='block';started=1;mPause();go(0)}
window.backAd=()=>{pv=0;$('#pb').style.display='none';if(stop){stop();stop=null}A.style.display='block';rend()};
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
const shrink=f=>new Promise(async r=>{const s=await rd(f),i=new Image();i.onload=()=>{const k=Math.min(1,1400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.onerror=()=>r(s);i.src=s});
function imp(s){try{const o=JSON.parse(s);C={...D,...o.C};PH=o.PH||[];MU=o.MU||null;mSwap();applyTheme();rend();toast('Imported! Press Save Changes to keep it.')}catch(e){toast('Invalid backup')}}
A.oninput=e=>{const t=e.target,d=t.dataset;if(d.k){C[d.k]=t.type=='checkbox'?t.checked:(t.type=='number'||t.type=='range')?+t.value:t.value;if(d.k=='vol')vol();if(d.k=='mOn'){C.mOn?(started&&mPlay()):mPause();ui()}applyTheme()}else if(d.w!=null)C.wishes[d.w]=t.value;else if(d.b)C.bless=t.value.split('\n').filter(s=>s.trim());else if(d.p)PH[d.i][d.p]=t.value};
A.onchange=async e=>{const t=e.target;if(t.id=='pf'){for(const f of t.files)if(/image\/(jpeg|png|webp)/.test(f.type))PH.push({src:await shrink(f),title:'',msg:''});rend()}
else if(t.id=='mf'&&t.files[0]){MU=await rd(t.files[0]);mSwap();rend()}else if(t.id=='imf'&&t.files[0])imp(await t.files[0].text())};
A.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i;
if(a=='tab'){tab=t.dataset.t;rend()}else if(a=='up'&&i>0){[PH[i-1],PH[i]]=[PH[i],PH[i-1]];rend()}else if(a=='dn'&&i<PH.length-1){[PH[i+1],PH[i]]=[PH[i],PH[i+1]];rend()}else if(a=='del'){PH.splice(i,1);rend()}
else if(a=='save')save();else if(a=='pv')preview();else if(a=='out')out();else if(a=='rm'){MU=null;mSwap();rend()}
else if(a=='ex'){const j=JSON.stringify({C,PH,MU});$('#bk').value=j;try{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));l.download='data.json';l.click()}catch(x){}toast('Backup ready — copy it from the box if no download starts')}
else if(a=='im')imp($('#bk').value)};
$('#gr').onclick=adLogin;addEventListener('hashchange',()=>{if(location.hash=='#admin')adLogin()});
/* boot */
(async()=>{try{C={...D,...JSON.parse(localStorage.getItem('nkC')||'{}')}}catch(e){}
PH=(await dbg('photos'))||[];MU=(await dbg('music'))||null;
let loc=null;try{loc=localStorage.getItem('nkC')}catch(e){}
if(!loc){try{const r=await Promise.race([fetch('data.json',{cache:'no-store'}),new Promise((_,j)=>setTimeout(j,5000))]);if(r.ok){const o=await r.json();C={...D,...o.C};PH=o.PH||[];MU=o.MU||null}}catch(e){}}
applyTheme();rz();loop();$('#ld').remove();setTimeout(()=>{if(!MU)try{SONG=mkSong()}catch(e){}},400);if(location.hash=='#admin')adLogin();go(0)})();
</script></body></html>
